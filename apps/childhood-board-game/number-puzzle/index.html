<body>

  <!-- 难度（棋盘尺寸）选择界面 -->
  <div id="mode-selection" class="overlay">
    <div class="overlay-content">
      <h1 class="game-title">数字华容道</h1>
      <p class="subtitle">滑动数字，让 1 到 N 依次归位</p>
      <div class="mode-buttons">
        <button type="button" class="btn btn-size" data-size="3">简单 3×3</button>
        <button type="button" class="btn btn-size" data-size="4">经典 4×4</button>
        <button type="button" class="btn btn-size" data-size="5">挑战 5×5</button>
      </div>
    </div>
  </div>

  <!-- 游戏区域 -->
  <div id="game-area">
    <!-- 状态栏 -->
    <div id="status-bar">
      <div class="status-item">
        <span class="label">难度：</span>
        <span id="size-label" class="status-value">经典 4×4</span>
      </div>
      <div class="status-item">
        <span class="label">步数：</span>
        <span id="move-count" class="status-value">0</span>
      </div>
      <div class="status-item">
        <span class="label">用时：</span>
        <span id="timer" class="status-value">00:00</span>
      </div>
      <div class="status-item">
        <span class="label">最佳：</span>
        <span id="best-record" class="status-value">—</span>
      </div>
    </div>

    <!-- 主游戏区域：棋盘 + 规则面板 -->
    <div id="game-main">
      <div id="board">
        <div id="board-grid">
          <!-- 方块通过 JavaScript 动态生成 -->
        </div>
      </div>

      <!-- 游戏规则面板 -->
      <div id="rules-panel">
        <h3>📜 游戏玩法</h3>
        <div class="rule-section">
          <h4>🎮 基本操作</h4>
          <ul>
            <li>点击空格旁边的数字即可滑动</li>
            <li>也可以用键盘方向键 / WASD</li>
            <li>方向键指向数字滑动的方向</li>
          </ul>
        </div>
        <div class="rule-section">
          <h4>🏆 胜利条件</h4>
          <ul>
            <li>把数字按 1、2、3…… 顺序排好</li>
            <li>右上角为最后一个数字，右下角留空</li>
          </ul>
        </div>
        <div class="rule-section">
          <h4>💡 小提示</h4>
          <ul>
            <li>每次打乱都可解，放心尝试</li>
            <li>归位的数字会变成绿色</li>
            <li>卡住时点「提示一步」</li>
            <li>成绩会保存在本机浏览器</li>
          </ul>
        </div>
        <div class="rule-section">
          <h4>📏 难度</h4>
          <ul>
            <li id="step-count">共 15 个数字方块，留 1 个空格</li>
          </ul>
        </div>
      </div>
    </div>

    <!-- 操作按钮 -->
    <div class="board-actions">
      <button type="button" id="btn-shuffle" class="btn btn-restart">重新打乱</button>
      <button type="button" id="btn-undo" class="btn btn-ghost">
        撤销一步（<span id="undo-count">0</span>）
      </button>
      <button type="button" id="btn-hint" class="btn btn-ghost">提示一步</button>
      <button type="button" id="btn-back" class="btn btn-ghost">切换难度</button>
    </div>

    <!-- 操作提示信息区域 -->
    <div id="message"></div>
  </div>

  <!-- 通关界面 -->
  <div id="game-over" class="overlay" style="display:none;">
    <div class="overlay-content">
      <h2 id="winner-text">🎉 拼好了！</h2>
      <p id="result-detail" class="result-detail"></p>
      <p id="result-record" class="result-record"></p>
      <div class="mode-buttons">
        <button type="button" id="btn-again" class="btn btn-restart">再来一局</button>
        <button type="button" id="btn-change-size" class="btn btn-ghost">换个难度</button>
      </div>
    </div>
  </div>

  <script src="ai.js"></script>
  <script src="game.js"></script>
</body>
